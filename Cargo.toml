[workspace]
resolver = "2"
members = [
    "src/sealpdf-core",
    "src/sealpdf-pdf",
    "src/sealpdf-cms",
    "src/sealpdf-tsp",
    "src/sealpdf-keystore",
    "src/sealpdf-pades",
    "src/sealpdf-validate",
    "src/cli",
    "src/sealpdf-ffi",
]
default-members = ["src/cli"]

[workspace.package]
publish = false
version = "0.1.5"
edition = "2024"

[workspace.dependencies]
assert_cmd = "2"
predicates = "3"
base64 = "0.23"
cms = "=0.3.0-rc.0"
const-oid = "0.10"
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
flate2 = "1"
getrandom = "0.4"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p12-keystore = "0.2"
png = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = "4.6"
cryptoki = "0.12"
lopdf = "0.46"
rsa = { version = "0.9", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
secrecy = "0.10"
security-framework = { version = "3", features = ["macos-12"] }
rpassword = "7"
serde = "1.0"
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
toml = "1"
ureq = "3"
spki = "0.8"
x509-cert = "0.3"
zeroize = "1"
tempfile = "3.27.0"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

sealpdf-core = { path = "src/sealpdf-core" }
sealpdf-pdf = { path = "src/sealpdf-pdf" }
sealpdf-cms = { path = "src/sealpdf-cms" }
sealpdf-tsp = { path = "src/sealpdf-tsp" }
sealpdf-keystore = { path = "src/sealpdf-keystore" }
sealpdf-pades = { path = "src/sealpdf-pades" }
sealpdf-validate = { path = "src/sealpdf-validate" }
