[workspace]
resolver = "2"
members = [
    "crates/certsign-core",
    "crates/certsign-pdf",
    "crates/certsign-cms",
    "crates/certsign-tsp",
    "crates/certsign-keystore",
    "crates/certsign-render",
    "crates/certsign-pades",
    "crates/certsign-validate",
    "src/cli",
]
default-members = ["src/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
cms = "=0.3.0-rc.0"
const-oid = "0.10"
der = { version = "0.8", features = ["alloc", "oid"] }
flate2 = "1"
getrandom = "0.4"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
png = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = "4.6"
lopdf = "0.45"
rsa = { version = "0.9", default-features = false, features = ["std"] }
serde = "1.0"
sha1 = "0.11"
sha2 = "0.11"
serde_json = "1.0"
toml = "0.8"
ureq = "3"
spki = "0.8"
x509-cert = "0.3"
tempfile = "3.27.0"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

certsign-core = { path = "crates/certsign-core" }
certsign-pdf = { path = "crates/certsign-pdf" }
certsign-cms = { path = "crates/certsign-cms" }
certsign-tsp = { path = "crates/certsign-tsp" }
certsign-keystore = { path = "crates/certsign-keystore" }
certsign-render = { path = "crates/certsign-render" }
certsign-pades = { path = "crates/certsign-pades" }
certsign-validate = { path = "crates/certsign-validate" }
