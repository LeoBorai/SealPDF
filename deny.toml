# cargo-deny: checks the dependency tree for known vulnerabilities, unwanted licenses,
# banned or duplicated crates, and crates from unexpected sources. Run with `cargo deny check`.

[graph]
# Check what is built on the platforms certsign supports, not only on the machine running the check.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Vulnerabilities, unmaintained crates and yanked releases are all errors.
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # `rsa` leaks key information through timing, observable by an attacker who can time many
    # operations over a network. certsign signs on the user's own machine, from a local file or
    # a key store, and a network cannot observe it, so the advisory's own guidance ("local use on
    # a non-compromised computer is fine") applies. There is no patched release. Revisit when
    # `rsa` has one, or if signing ever runs as a network service.
    { id = "RUSTSEC-2023-0071", reason = "local signing only: no attacker can time it over a network" },
]

[licenses]
# The workspace crates are not published and carry no license of their own.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla's CA list data in webpki-roots, used by the TSA client for HTTPS.
    "CDLA-Permissive-2.0",
]

[bans]
# A second version of a crate is an error. The ones below are known and unavoidable for now:
# each says what holds it back, so that a new duplicate fails the check instead of slipping in.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

# Whole subtrees that sit on an older generation of a library family.
skip-tree = [
    { crate = "p12-keystore@0.2.1", reason = "pinned to the 0.2 series, which uses the previous RustCrypto generation (der 0.7, cms 0.2, sha2 0.10, aes 0.8, nom 7). Later versions need pre-release crates that cannot be built together with the cms release candidate. Drop this when cms 0.3 is final." },
    { crate = "rsa@0.9.10", reason = "the stable RSA crate is on the previous RustCrypto generation (rand 0.8, rand_core 0.6, signature 2, pkcs8 0.10); 0.10 is still a release candidate." },
]

# Single crates held back by something outside our control.
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png still uses 0.8 while flate2 has moved to 0.9." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
