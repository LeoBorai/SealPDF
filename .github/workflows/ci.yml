name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      # pyHanko is the reference validator and the third-party signer in the interoperability
      # tests. Where it is installed those tests are required to run, not skipped.
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"

      - name: Install pyHanko
        if: runner.os != 'Windows'
        run: |
          python -m pip install pyhanko
          echo "CERTSIGN_REQUIRE_PYHANKO=1" >> "$GITHUB_ENV"

      # The tests that sign with real PKCS#11 and OpenSSL fixtures need SoftHSM2 and OpenSSL 3.
      # Where SoftHSM2 is installed they are required to run, not skipped.
      - name: Install SoftHSM2 and OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2
          echo "CERTSIGN_REQUIRE_PKCS11=1" >> "$GITHUB_ENV"

      - name: Install SoftHSM2 and OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install softhsm openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "SOFTHSM2_MODULE=$(brew --prefix)/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "SOFTHSM2_UTIL=$(brew --prefix)/bin/softhsm2-util" >> "$GITHUB_ENV"
          echo "CERTSIGN_REQUIRE_PKCS11=1" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --profile ci --no-tests=pass
