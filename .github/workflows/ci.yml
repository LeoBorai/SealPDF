name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without any change here, so the dependency check also runs weekly.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@cargo-deny

      # Advisories, licenses, duplicate crate versions and sources, as set in deny.toml.
      # `-D warnings` turns every warning into an error: a new duplicate version, an unused
      # exception in deny.toml or a license that is no longer needed all fail the job.
      - name: cargo deny
        run: cargo deny check -D warnings

  test:
    if: github.event_name != 'schedule'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      # pyHanko is the reference validator and the third-party signer in the interoperability
      # tests. Where it is installed those tests are required to run, not skipped.
      - uses: actions/setup-python@v7
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"

      - name: Install pyHanko
        if: runner.os != 'Windows'
        run: |
          python -m pip install pyhanko
          echo "SEALPDF_REQUIRE_PYHANKO=1" >> "$GITHUB_ENV"

      # The tests that sign with real PKCS#11 and OpenSSL fixtures need SoftHSM2 and OpenSSL 3.
      # Where SoftHSM2 is installed they are required to run, not skipped.
      - name: Install SoftHSM2 and OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2
          echo "SEALPDF_REQUIRE_PKCS11=1" >> "$GITHUB_ENV"

      - name: Install SoftHSM2 and OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install softhsm openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          echo "SOFTHSM2_MODULE=$(brew --prefix)/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "SOFTHSM2_UTIL=$(brew --prefix)/bin/softhsm2-util" >> "$GITHUB_ENV"
          echo "SEALPDF_REQUIRE_PKCS11=1" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --profile ci --no-tests=pass

  # The SwiftUI app: the Rust library, the Swift build, and the .app bundle, through the same
  # `just` recipe a developer runs. The window itself cannot be opened on a runner.
  macos-app:
    if: github.event_name != 'schedule'
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      - name: Bundle
        env:
          APP_COMMIT: ${{ github.sha }}
        run: just bundle-macos

      - name: Check the bundle
        run: |
          app="target/macos/SealPDF.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/SealPDF"
          codesign --verify --deep --strict "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SealPDFCommit' "$app/Contents/Info.plist")" == "$GITHUB_SHA" ]]

      - uses: actions/upload-artifact@v7
        with:
          name: SealPDF-macos-app
          path: target/macos/SealPDF.app
          if-no-files-found: error
