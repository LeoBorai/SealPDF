name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# A release is never cancelled half way: a second tag waits for the first.
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The installer and the binary report the workspace version, so a tag that does not match it
  # would publish a build that calls itself something else. Refuse before building anything.
  check-tag:
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare
        run: |
          cargo_version="$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$cargo_version" || "$tag_version" != "$cargo_version" ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match the workspace version '$cargo_version'"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-14, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-14, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p sealpdf-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          name="sealpdf-${GITHUB_REF_NAME}-${TARGET}"
          bin="sealpdf"
          [[ "$EXT" == "zip" ]] && bin="sealpdf.exe"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/${bin}" "dist/$name/"
          cp README.md "dist/$name/"
          cd dist
          if [[ "$EXT" == "zip" ]]; then
            7z a -tzip "${name}.zip" "$name" >/dev/null
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.${EXT}" > "${name}.${EXT}.sha256"
          else
            shasum -a 256 "${name}.${EXT}" > "${name}.${EXT}.sha256"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: sealpdf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The macOS app, bundled from the release commit. Apple Silicon only: the runner builds for
  # its own architecture.
  app-macos:
    name: Bundle macOS app
    needs: check-tag
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      - name: Bundle
        env:
          APP_COMMIT: ${{ github.sha }}
        run: just bundle-macos

      # `ditto` keeps what a plain zip loses (resource forks, the code signature's symlinks).
      - name: Package
        run: |
          name="SealPDF-${GITHUB_REF_NAME}-macos-aarch64"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/macos/SealPDF.app "dist/${name}.zip"
          cd dist
          shasum -a 256 "${name}.zip" > "${name}.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: sealpdf-macos-app
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, app-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sealpdf-*
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
